_defaults_: default.yaml

# Model A – the VALIDATOR. "Is there a bin, and where?"
#
# One class. Class-agnostic on purpose: it must fire on a bin type it has never
# seen, because that is exactly the case the improvement loop depends on
# detecting. See docs/01-architecture.md § 3.
#
# The majority of its training data is NOT bins. A detector trained only on
# photos of bins learns that everything is a bin; the negative corpus is what
# buys precision, and precision is what makes "the identifier disagrees with me"
# a trustworthy signal rather than noise.

run_name: validator

model:
  arch: yolo11n
  pretrained: true

data:
  repo_id: arudaev/smart-bin-detect
  imgsz: 448              # matches the frame size the client uploads
  classes: ["bin"]
  classes_from_taxonomy: false

  negatives:
    # Roughly 30:1 negatives to positives. The ratio is the point.
    open_corpus:
      source: open-images
      query: ["street", "urban", "sidewalk", "residential", "parking"]
      count: 15000
    hard_negatives:
      # The things that actually get mistaken for bins.
      classes: ["postbox", "planter", "utility_cabinet", "parked_car",
                "wheeled_luggage", "air_conditioner", "gas_meter",
                "recycling_logo_on_non_bin"]
      count: 2500
    # Harvested automatically: frames where the validator fired but a
    # contributor said "there is no bin here".
    mined_false_positives: true

training:
  epochs: 80
  batch: 32

# Wider than the identifier's: the validator must survive rain, dusk and odd
# angles, and it has no colour semantics to protect.
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.5
  degrees: 10.0
  scale: 0.6
  mosaic: 1.0
  mixup: 0.10

export:
  imgsz: 448
  quantise: int8
  # Hard gates: these fail the build. Concurrency is the cost ceiling, so
  # latency IS the budget.
  gates:
    max_median_latency_ms: 50     # service CPU (2 vCPU), single frame @ 448

    # THE fp32 PROFILE. docs/12 P13, 2026-08-22.
    #
    # The ship gate used to refuse any unquantised artefact, with a failure
    # string asserting "it will not meet the latency budget". Measured, paired
    # against int8 on one Cascade Lake instance with the arms alternated, that is
    # false at 448: fp32 is 24.6 ms p50 against this same 50 ms budget, and int8
    # is 17.9 ms. The refusal was enforcing a proxy for a fact that had changed.
    #
    # It exists for the validator and NOT for the identifier, because only the
    # validator needs it: P9 measured int8 costing the validator 0.727 mAP@0.5
    # against a 0.02 budget, and P10 found no module outside the detection head
    # to blame. fp32 is the only route to a validator that can ship on accuracy
    # at all. P11 measured int8 costing the identifier 0.0000 top-1, so the
    # identifier has nothing to gain and would only pay the concurrency.
    fp32:
      # SAME latency budget. This profile is not a discount - it exists so the
      # format stops being a gate of its own and the measured latency decides.
      max_median_latency_ms: 50
      # SAME accuracy budget, and `Gates.from_config` raises if this is ever
      # loosened. A per-format accuracy budget would let a format buy its way
      # past the gate that exists to stop a confidently-wrong model shipping.
      max_accuracy_drop: 0.02
      # WHAT IT COSTS, carried on the artefact rather than left in a document.
      # 5 concurrent scanners at one bin per frame become 4.
      concurrent_scanners_at_1_bin: 4
      measured_by: "docs/research/probes/P13-fp32-validator-viability.md, GCE n2-standard-4 Cascade Lake, 2026-08-22"

  # Reported, not gating. These are the docs/04 § 7 targets: a model that misses
  # one is a result to write down and act on, not a build failure – unlike the
  # gates above, which are what makes the free tier arithmetic work at all.
  targets:
    min_recall_heldout_city: 0.97
    min_precision_on_negatives: 0.97
