_defaults_: default.yaml

# Model B – the IDENTIFIER. "What kind of bin is it?"
#
# Runs ONLY on crops produced by the validator, never on a full frame. Three
# consequences, all good:
#   1. a smaller model reaches higher accuracy on the same data
#   2. colour is measured from the object (ideally from the SAM 2 mask), not
#      from whatever was behind it
#   3. multi-bin scenes are free – N crops, N independent identifications
#
# Its classes are physical FORM FACTORS, not waste categories. What a blue lid
# means lives in a region pack. See docs/02-waste-taxonomy.md § 1.
#
# It is a CLASSIFIER, not a detector. The validator has already localised the
# object and the crop is filled by it, so re-detecting would spend the 25 ms
# budget re-deriving a box that is already known. Classification also gives
# `unknown` a better basis: a max-softmax below `unknown_threshold` rather than
# a box score below a confidence floor.

run_name: identifier

model:
  arch: yolo11s-cls       # larger than the validator: this is the hard problem
  pretrained: true

data:
  repo_id: arudaev/smart-bin-identify
  imgsz: 320              # crops, not frames
  # Classes come from data/taxonomy/waste-streams.json `form_factors`, in file
  # order. That order is the ONNX class index – never reorder without retraining.
  classes_from_taxonomy: true

  crops:
    source: validator_boxes
    padding: 0.12         # a little context helps distinguish 240 L from 1100 L
    min_box_px: 64

  # Label provenance is tracked so its contribution can be measured – and rolled
  # back if machine labels turn out to hurt.
  label_sources: ["human", "machine_agreed", "legacy"]

  # Only adjudicated crops train the identifier. A crop whose form factor was
  # inferred from a legacy STREAM label ("Restmüll") is not a label – the same
  # stream is a small wheelie bin outside a house and a large one behind a
  # block. See ml/scripts/adjudicate.py and docs/07-roadmap.md phase 2.
  require_adjudication: true

# Where `unknown` comes from. Below this max-softmax the identifier says it does
# not know, which is a designed product state and the entry point to the
# improvement loop – not an error. docs/01-architecture.md § 3.
#
# PROVISIONAL. 0.55 is a guess, not a calibrated operating point, and max-softmax
# is a BASELINE: the literature is explicit that softmax confidence can be
# arbitrarily high on out-of-distribution inputs, which is exactly the input this
# threshold exists to catch. It is a strong baseline and hard to beat, so it
# stays until there is evidence. What it is not is "principled".
#
# docs/12 probe P2 replaces it with a threshold chosen at a stated NOVELTY
# PRECISION over a frozen five-bucket set, after comparing max-softmax against
# energy, max-logit and kNN-on-embeddings. Pin the run that produced it here when
# it lands. See docs/research/02-novelty-and-abstention.md.
inference:
  unknown_threshold: 0.55

training:
  epochs: 100
  batch: 64

# Note hsv_h is TIGHT. Colour is not a learnt class, but hue-shifting the
# training data still degrades the shape priors the model builds around
# coloured lids.
augment:
  hsv_h: 0.008
  hsv_s: 0.6
  hsv_v: 0.45
  degrees: 8.0
  scale: 0.4
  fliplr: 0.5
  mosaic: 0.0             # crops – mosaic would destroy the framing signal
  erasing: 0.25           # occlusion by cars, people, other bins

export:
  imgsz: 320
  quantise: int8
  # Hard gate: this fails the build.
  gates:
    max_median_latency_ms: 25       # per crop, service CPU (2 vCPU) @ 320
  # Reported, not gating – the docs/04 § 7 target.
  targets:
    min_formfactor_acc_heldout_city: 0.85
