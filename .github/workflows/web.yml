name: web

# `npm run verify` is the whole gate: typecheck, 274 tests, the locale report,
# a production build, and the transfer budget. It is what AGENTS.md already
# asks for before a commit; running it here is what makes that true rather
# than aspirational.
#
# data/taxonomy is in the filter because the client reads it through the
# @taxonomy alias - there is exactly one copy of the taxonomy and web/ is one
# of its two readers, so a change there can break the build from outside web/.

on:
  push:
    paths:
      - "web/**"
      - "data/taxonomy/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "data/taxonomy/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # `ci` rather than `install`: the lockfile is the point, and npm's
        # optional-dependency handling for platform binaries is the reason this
        # repository has already lost an afternoon to a stale node_modules.
        run: npm ci

      - name: Verify
        # typecheck -> tests -> locales -> build -> transfer budget.
        # check-bundle.mjs is inside this and fails the build if any dev-only
        # module reaches dist, which is a guardrail rather than a lint.
        run: npm run verify

      - name: The wire fixtures match what the encoder produces
        # The TypeScript half of the cross-language contract. If protocol.ts
        # changed without re-emitting, the bytes on disk are stale and the
        # service is being checked against a wire nothing sends.
        run: |
          npm run emit:fixtures
          if [ -n "$(git status --porcelain src/transport/__fixtures__/requests)" ]; then
            echo "::error::protocol.ts and the committed request fixtures disagree."
            echo "Run: npm --prefix web run emit:fixtures, review the diff, and commit it."
            git --no-pager diff -- src/transport/__fixtures__/requests
            exit 1
          fi

  e2e:
    # A SEPARATE JOB, not a step inside `verify`.
    #
    # `verify` is deliberately browserless - typecheck, 281 unit tests, locales,
    # build, transfer budget - and it stays that way: it is what AGENTS.md asks
    # for before a commit, and a developer should not need a 150 MB browser
    # download to run it.
    #
    # These specs exist because two bugs reached this repository by somebody
    # looking at a screen: a Surface Pro 11 opening its selfie camera, and the
    # scanner drawn as a phone on a 1440-wide tablet. Neither was reachable from
    # vitest, which has no layout.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        # Chromium only. Both bugs were Chromium bugs (Chrome and Edge on
        # Windows), and adding WebKit here would imply a claim about Safari that
        # nothing has tested.
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        # playwright.config.ts builds and serves the app itself via webServer.
        # PLAYWRIGHT_HTML_REPORT makes a failure inspectable: the `github` and
        # `list` reporters print to the log and leave no artefact, so the first
        # CI-only layout failure had nothing to download and had to be guessed
        # at from one string. It costs nothing on a green run.
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: npm run test:e2e -- --reporter=github,list,html

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
